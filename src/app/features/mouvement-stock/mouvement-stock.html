<div class="page">


    <div class="header">

        <h1>
            Historique des mouvements
        </h1>

    </div>




    <table 
        mat-table
        [dataSource]="mouvements"
        class="mat-elevation-z3">





        <!-- DATE -->

        <ng-container matColumnDef="date">

            <th mat-header-cell *matHeaderCellDef>
                Date
            </th>


            <td mat-cell *matCellDef="let m">

                {{m.dateMouvement | date:'dd/MM/yyyy HH:mm'}}

            </td>

        </ng-container>







        <!-- LOT -->

        <ng-container matColumnDef="lot">

            <th mat-header-cell *matHeaderCellDef>
                Lot
            </th>


            <td mat-cell *matCellDef="let m">

                {{m.numeroLot}}

            </td>

        </ng-container>








        <!-- PRODUIT -->

        <ng-container matColumnDef="produit">

            <th mat-header-cell *matHeaderCellDef>
                Produit
            </th>


            <td mat-cell *matCellDef="let m">

                {{m.produitDesignation}}

            </td>


        </ng-container>









        <!-- TYPE -->

        <ng-container matColumnDef="type">

            <th mat-header-cell *matHeaderCellDef>
                Type
            </th>


            <td mat-cell *matCellDef="let m">

                <span 
                [ngClass]="{
                    'entree': m.type === 'ENTREE',
                    'sortie': m.type === 'SORTIE'
                }">

                    {{m.type}}

                </span>


            </td>


        </ng-container>









        <!-- QUANTITE -->

        <ng-container matColumnDef="quantite">

            <th mat-header-cell *matHeaderCellDef>
                Quantité
            </th>


            <td mat-cell *matCellDef="let m">

                {{m.quantite}}

            </td>


        </ng-container>









        <!-- REFERENCE -->

        <ng-container matColumnDef="reference">

            <th mat-header-cell *matHeaderCellDef>
                Référence
            </th>


            <td mat-cell *matCellDef="let m">

                {{m.reference || '-'}}

            </td>


        </ng-container>









        <!-- OBSERVATION -->

        <ng-container matColumnDef="observation">

            <th mat-header-cell *matHeaderCellDef>
                Observation
            </th>


            <td mat-cell *matCellDef="let m">

                {{m.observation || '-'}}

            </td>


        </ng-container>







        <tr 
        mat-header-row
        *matHeaderRowDef="displayedColumns">

        </tr>





        <tr 
        mat-row
        *matRowDef="let row; columns:displayedColumns">

        </tr>



    </table>






    <div 
    class="empty"
    *ngIf="mouvements.length===0">


        Aucun mouvement enregistré


    </div>



</div>
