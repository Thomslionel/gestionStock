<h2 mat-dialog-title>

    {{data ? 'Modifier le produit':'Nouveau produit'}}

</h2>



<mat-dialog-content>


    <form [formGroup]="form" class="form">



        <mat-form-field appearance="outline">

            <mat-label>
                Code
            </mat-label>

            <input matInput formControlName="code">

        </mat-form-field>





        <mat-form-field appearance="outline">

            <mat-label>
                Désignation
            </mat-label>


            <input matInput formControlName="designation">


        </mat-form-field>





        <mat-form-field appearance="outline">

            <mat-label>
                Description
            </mat-label>


            <textarea matInput formControlName="description">

</textarea>


        </mat-form-field>





        <div class="row">


            <mat-form-field appearance="outline">


                <mat-label>
                    Prix achat
                </mat-label>


                <input type="number" matInput formControlName="prixAchat">


            </mat-form-field>




            <mat-form-field appearance="outline">


                <mat-label>
                    Prix vente
                </mat-label>


                <input type="number" matInput formControlName="prixVente">


            </mat-form-field>



        </div>






        <div class="row">


            <mat-form-field appearance="outline">


                <mat-label>
                    TVA
                </mat-label>


                <input type="number" matInput formControlName="tva">


            </mat-form-field>





            <mat-form-field appearance="outline">


                <mat-label>
                    Stock minimum
                </mat-label>


                <input type="number" matInput formControlName="stockMinimum">


            </mat-form-field>



        </div>






        <mat-form-field appearance="outline">


            <mat-label>
                Catégorie
            </mat-label>



            <mat-select formControlName="categorieId">


                <mat-option *ngFor="let c of categories" [value]="c.id">


                    {{c.libelle}}


                </mat-option>



            </mat-select>


        </mat-form-field>





        <mat-checkbox formControlName="actif">


            Actif


        </mat-checkbox>



    </form>


</mat-dialog-content>





<mat-dialog-actions align="end">


    <button mat-button (click)="fermer()">

        Annuler

    </button>



    <button mat-raised-button color="primary" (click)="enregistrer()">


        {{data?'Modifier':'Enregistrer'}}


    </button>


</mat-dialog-actions>
