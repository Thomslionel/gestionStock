<div class="page">


    <div class="header">


        <h1>
            Gestion des produits
        </h1>



        <button mat-raised-button color="primary" (click)="nouveauProduit()">


            <mat-icon>
                add
            </mat-icon>

            Nouveau produit


        </button>


    </div>




    <table mat-table [dataSource]="produits" class="mat-elevation-z3">



        <ng-container matColumnDef="code">

            <th mat-header-cell *matHeaderCellDef>
                Code
            </th>


            <td mat-cell *matCellDef="let p">

                {{p.code}}

            </td>

        </ng-container>





        <ng-container matColumnDef="designation">

            <th mat-header-cell *matHeaderCellDef>
                Désignation
            </th>


            <td mat-cell *matCellDef="let p">

                {{p.designation}}

            </td>

        </ng-container>





        <ng-container matColumnDef="categorie">

            <th mat-header-cell *matHeaderCellDef>
                Catégorie
            </th>


            <td mat-cell *matCellDef="let p">

                {{p.categorieLibelle}}

            </td>

        </ng-container>





        <ng-container matColumnDef="prixAchat">

            <th mat-header-cell *matHeaderCellDef>
                Prix achat
            </th>


            <td mat-cell *matCellDef="let p">

                {{p.prixAchat}} FCFA

            </td>

        </ng-container>





        <ng-container matColumnDef="prixVente">

            <th mat-header-cell *matHeaderCellDef>
                Prix vente
            </th>


            <td mat-cell *matCellDef="let p">

                {{p.prixVente}} FCFA

            </td>

        </ng-container>





        <ng-container matColumnDef="stockMinimum">

            <th mat-header-cell *matHeaderCellDef>
                Stock min
            </th>


            <td mat-cell *matCellDef="let p">

                {{p.stockMinimum}}

            </td>

        </ng-container>





        <ng-container matColumnDef="actif">

            <th mat-header-cell *matHeaderCellDef>
                Etat
            </th>


            <td mat-cell *matCellDef="let p">


                <span class="status" [ngClass]="p.actif?'active':'inactive'">

                    {{p.actif?'Actif':'Inactif'}}

                </span>


            </td>

        </ng-container>





        <ng-container matColumnDef="actions">


            <th mat-header-cell *matHeaderCellDef>
                Actions
            </th>


            <td mat-cell *matCellDef="let p">


                <button mat-icon-button color="primary" (click)="modifierProduit(p)">

                    <mat-icon>
                        edit
                    </mat-icon>

                </button>



                <button mat-icon-button color="warn" (click)="supprimerProduit(p)">

                    <mat-icon>
                        delete
                    </mat-icon>

                </button>


            </td>


        </ng-container>





        <tr mat-header-row *matHeaderRowDef="displayedColumns">

        </tr>


        <tr mat-row *matRowDef="let row; columns: displayedColumns">

        </tr>



    </table>


</div>
