<h2 mat-dialog-title>

    {{ data ? 'Modifier une catégorie' : 'Nouvelle catégorie' }}

</h2>

<mat-dialog-content>

    <form [formGroup]="form">

        <mat-form-field appearance="outline" class="full-width">

            <mat-label>Code</mat-label>

            <input
                matInput
                formControlName="code">

        </mat-form-field>


        <mat-form-field appearance="outline" class="full-width">

            <mat-label>Libellé</mat-label>

            <input
                matInput
                formControlName="libelle">

        </mat-form-field>


        <mat-form-field appearance="outline" class="full-width">

            <mat-label>Description</mat-label>

            <textarea
                matInput
                rows="3"
                formControlName="description">
            </textarea>

        </mat-form-field>


        <mat-checkbox formControlName="actif">

            Actif

        </mat-checkbox>

    </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button
        mat-button
        (click)="fermer()">

        Annuler

    </button>

    <button
        mat-raised-button
        color="primary"
        (click)="enregistrer()">

        Enregistrer

    </button>

</mat-dialog-actions>
