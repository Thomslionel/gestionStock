<div class="page">


    <div class="header">

        <h1>

            Gestion des catégories

        </h1>

        <button mat-raised-button color="primary" (click)="nouvelleCategorie()">

            <mat-icon>

                add

            </mat-icon>

            Nouvelle catégorie

        </button>

    </div>



    <table mat-table [dataSource]="categories" class="mat-elevation-z3">


        <!-- CODE -->

        <ng-container matColumnDef="code">

            <th mat-header-cell *matHeaderCellDef>
                Code
            </th>


            <td mat-cell *matCellDef="let c">

                {{c.code}}

            </td>

        </ng-container>



        <!-- LIBELLE -->

        <ng-container matColumnDef="libelle">

            <th mat-header-cell *matHeaderCellDef>
                Libellé
            </th>


            <td mat-cell *matCellDef="let c">

                {{c.libelle}}

            </td>

        </ng-container>



        <!-- DESCRIPTION -->

        <ng-container matColumnDef="description">

            <th mat-header-cell *matHeaderCellDef>
                Description
            </th>


            <td mat-cell *matCellDef="let c">

                {{c.description}}

            </td>

        </ng-container>



        <!-- ACTIF -->

        <ng-container matColumnDef="actif">

            <th mat-header-cell *matHeaderCellDef>
                Etat
            </th>


            <td mat-cell *matCellDef="let c">

                {{c.actif ? 'Actif':'Inactif'}}

            </td>

        </ng-container>



        <!-- ACTIONS -->

        <ng-container matColumnDef="actions">

            <th mat-header-cell *matHeaderCellDef>
                Actions
            </th>


            <td mat-cell *matCellDef="let c">


                <button mat-icon-button color="primary" matTooltip="Modifier" (click)="modifierCategorie(c)">

                    <mat-icon>
                        edit
                    </mat-icon>

                </button>



                <button mat-icon-button color="warn" matTooltip="Supprimer" (click)="supprimerCategorie(c)">

                    <mat-icon>
                        delete
                    </mat-icon>

                </button>


            </td>

        </ng-container>



        <tr mat-header-row *matHeaderRowDef="displayedColumns">

        </tr>



        <tr mat-row *matRowDef="let row; columns: displayedColumns">

        </tr>


    </table>


</div>
